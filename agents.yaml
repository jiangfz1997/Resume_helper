# Model configuration for each agent.
# provider: "google" (default) | "ollama"
#
# Google provider fields:
#   model        - Gemini model name
#   temperature  - 0.0-1.0
#   thinking_level - override global default ("minimal"|"low"|"medium"|"high")
#   max_tokens   - max output tokens (optional)
#
# Ollama provider fields (set provider: ollama per-agent to override):
#   model        - Ollama model tag
#   base_url     - Ollama server (defaults to global base_url)
#   format       - "json" to enforce JSON output
#   num_predict  - max output tokens

base_url: "http://localhost:11434"
default_provider: google

google:
  api_key_env: GOOGLE_API_KEY
  thinking_level: minimal
  max_retries: 3
  timeout: 30

# OpenAI fallback — activated by setting env: LLM_PROVIDER=openai
# api_key_env defaults to OPENAI_API_KEY
openai:
  api_key_env: OPENAI_API_KEY
  max_retries: 3
  timeout: 60
  agents:
    jd_analyzer:           OPENAI_FAST_MODEL
    skill_matcher:         OPENAI_FAST_MODEL
    resume_tailor:         OPENAI_SMART_MODEL
    resume_chat_json:      OPENAI_FAST_MODEL
    resume_chat_stream:    OPENAI_FAST_MODEL
    section_detector:      OPENAI_SMART_MODEL
    section_parser:        OPENAI_FAST_MODEL
    diagnostic_analyzer:   OPENAI_SMART_MODEL
    batch_verifier:        OPENAI_FAST_MODEL
    micro_validator:       OPENAI_FAST_MODEL
    chat_intent_router:    OPENAI_FAST_MODEL
    experience_summarizer: OPENAI_FAST_MODEL
    top_n_selector:        OPENAI_FAST_MODEL

agents:
  jd_analyzer:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.1
    thinking_level: medium

  skill_matcher:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.3
    max_tokens: 2048
    thinking_level: low

  resume_tailor:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.2
    thinking_level: low

  # resume_chat_agent uses two model instances: one for JSON patch, one for streaming text
  resume_chat_json:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.3
    thinking_level: low
    timeout: 120

  resume_chat_stream:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.3
    thinking_level: minimal
    timeout: 120


  # Two-phase resume PDF parser
  # Header detection drives every downstream split, and a miss silently merges one
  # section into another, so this runs on the stronger model despite the tiny payload.
  section_detector:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.0
    thinking_level: low

  section_parser:
    model: GOOGLE_FLASH_LITE_MODEL
    temperature: 0.0
    thinking_level: minimal

  # Copilot diagnostic agents
  diagnostic_analyzer:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.2
    max_tokens: 8192
    thinking_level: low

  batch_verifier:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.0
    max_tokens: 1024
    thinking_level: minimal

  micro_validator:
    model: GOOGLE_FLASH_LITE_MODEL
    temperature: 0.0
    max_tokens: 256
    thinking_level: minimal

  chat_intent_router:
    model: GOOGLE_FLASH_LITE_MODEL
    temperature: 0.0
    max_tokens: 128
    thinking_level: minimal

  experience_summarizer:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.0
    max_tokens: 2048
    thinking_level: low

  top_n_selector:
    model: GOOGLE_FLASH_MODEL
    temperature: 0.0
    max_tokens: 4096
    thinking_level: low