AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31
Description: Authenticated API for the job discovery dashboard

Parameters:
  RecordsTableName:
    Type: String
    Default: job-discovery-records
  ListingsTableName:
    Type: String
    Default: job-discovery-listings
  AllowedOrigin:
    Type: String
    Description: CloudFront dashboard origin, for example https://jobs.example.com
  CallbackUrl:
    Type: String
    Description: Cognito callback URL, for example https://jobs.example.com/auth/callback
  LogoutUrl:
    Type: String
    Description: Cognito logout URL, for example https://jobs.example.com/jobs
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito managed login domain
  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing the dashboard Lambda deployment package
  DashboardLambdaCodeKey:
    Type: String
    Description: Immutable S3 key for the dashboard Lambda deployment package
  ScoringLambdaCodeKey:
    Type: String
    Description: Immutable S3 key for the personalized scoring Lambda deployment package
  GeminiApiKey:
    Type: String
    NoEcho: true
  GeminiModel:
    Type: String
  DedupKeysTableName:
    Type: String
    Default: job-discovery-dedup-keys
  SourceLookupTableName:
    Type: String
    Default: job-discovery-source-lookup

Resources:
  DashboardUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: job-dashboard-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  DashboardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: job-dashboard-spa
      UserPoolId: !Ref DashboardUserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  DashboardUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref DashboardUserPool

  DashboardUserDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: job-discovery-user-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: entity_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: entity_key
          KeyType: RANGE

  DashboardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${DashboardUserPool}
              audience:
                - !Ref DashboardUserPoolClient

  DashboardReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-dashboard-read
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !Ref DashboardLambdaCodeKey
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          RECORDS_TABLE: !Ref RecordsTableName
          LISTINGS_TABLE: !Ref ListingsTableName
          USER_DATA_TABLE: !Ref DashboardUserDataTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          REQUIRE_AUTH: 'true'
          SCORING_FUNCTION_NAME: !Ref PersonalizedScoringFunction
      Policies:
        - Statement:
            - Sid: ReadDashboardTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RecordsTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ListingsTableName}
            - Sid: ReadWriteDashboardUserState
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt DashboardUserDataTable.Arn
            - Sid: InvokePersonalizedScoring
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt PersonalizedScoringFunction.Arn
      Events:
        ListJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /jobs
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /jobs/{job_id}
        ListRuns:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /runs
        GetScoringQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /scoring/queue
        ScoreJobNow:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: POST
            Path: /jobs/{job_id}/score
        GetUserState:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /user-state
        MarkJobViewed:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: PUT
            Path: /jobs/{job_id}/viewed
        UpdateJobState:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: PUT
            Path: /jobs/{job_id}/state
        MarkRunViewed:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: PUT
            Path: /runs/{run_id}/viewed
        GetScoringProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /profile/scoring
        UpdateScoringProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: PUT
            Path: /profile/scoring
        GetDiscoverySettings:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: GET
            Path: /settings/discovery
        UpdateDiscoverySettings:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Method: PUT
            Path: /settings/discovery

  PersonalizedScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-discovery-score
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !Ref ScoringLambdaCodeKey
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 900
      Environment:
        Variables:
          RECORDS_TABLE: !Ref RecordsTableName
          LISTINGS_TABLE: !Ref ListingsTableName
          DEDUP_KEYS_TABLE: !Ref DedupKeysTableName
          SOURCE_LOOKUP_TABLE: !Ref SourceLookupTableName
          USER_DATA_TABLE: !Ref DashboardUserDataTable
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - Statement:
            - Sid: ScoreJobRecords
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RecordsTableName}
            - Sid: ReadWritePersonalizedScores
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt DashboardUserDataTable.Arn
      Events:
        ScheduledScoring:
          Type: ScheduleV2
          Properties:
            # 45 minutes after each crawl. The crawl schedule itself lives
            # outside this template (job-discovery-workday-schedule /
            # job-discovery-jobspy-schedule, EventBridge Scheduler,
            # America/Toronto) -- keep these two in sync by hand if either
            # changes, since SAM doesn't own the crawler Lambdas.
            ScheduleExpression: cron(45 10,14,20 * * ? *)
            ScheduleExpressionTimezone: America/Toronto
            Input: '{"limit":20}'

Outputs:
  ApiUrl:
    Value: !Sub https://${DashboardApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref DashboardUserPool
  UserPoolClientId:
    Value: !Ref DashboardUserPoolClient
  CognitoLoginDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  UserDataTableName:
    Value: !Ref DashboardUserDataTable
  PersonalizedScoringFunctionName:
    Value: !Ref PersonalizedScoringFunction
