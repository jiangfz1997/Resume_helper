AWSTemplateFormatVersion: '2010-09-09'
Description: Shared job discovery schedules and their EventBridge Scheduler invocation role

Parameters:
  SchedulerRoleName:
    Type: String
    Description: Physical name of the retained Scheduler role being imported
  WorkdayFunctionName:
    Type: String
    Default: job-discovery-workday
  JobSpyFunctionName:
    Type: String
    Default: job-discovery-jobspy

Resources:
  DiscoverySchedulerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref SchedulerRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDiscoveryCrawlers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkdayFunctionName}
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JobSpyFunctionName}

  WorkdayDiscoverySchedule:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: job-discovery-workday-managed
      GroupName: default
      Description: Run the shared Workday discovery crawler three times per Toronto day
      ScheduleExpression: cron(0 10 * * ? *)
      ScheduleExpressionTimezone: America/Toronto
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkdayFunctionName}
        RoleArn: !GetAtt DiscoverySchedulerRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 1

  JobSpyDiscoverySchedule:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: job-discovery-jobspy-managed
      GroupName: default
      Description: Run the shared JobSpy discovery crawler three times per Toronto day
      ScheduleExpression: cron(0 10,14,20 * * ? *)
      ScheduleExpressionTimezone: America/Toronto
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JobSpyFunctionName}
        RoleArn: !GetAtt DiscoverySchedulerRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 1
