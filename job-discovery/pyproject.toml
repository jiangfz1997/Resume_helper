[project]
name = "job-discovery"
version = "0.1.0"
description = "Flow 1: scheduled job discovery, normalization, dedup, hard filtering, coarse scoring."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "moto[dynamodb]>=5.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_discovery"]
