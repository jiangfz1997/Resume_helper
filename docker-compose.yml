services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_agent_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api and web sit behind the "app" profile so that a bare "docker compose up -d"
  # still starts only the database, which is what local development needs.
  # Run the whole stack with: docker compose --profile app up -d --build
  api:
    build: .
    container_name: resume_agent_api
    restart: always
    profiles: ["app"]
    # Model names and provider API keys are read straight from .env.
    env_file: .env
    environment:
      # Overrides whatever .env holds: inside the network the database is
      # reached by service name, not on localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend-vue
    container_name: resume_agent_web
    restart: always
    profiles: ["app"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  pgdata:
